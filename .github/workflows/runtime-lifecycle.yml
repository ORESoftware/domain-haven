name: Domain error-response lifecycle regression

on:
  pull_request:
    paths:
      - 'src/main.ts'
      - 'test/runtime-lifecycle.test.js'
      - 'test/runtime-trace-policy.test.js'
      - 'test/runtime-fatal-boundary.test.js'
      - 'test/runtime-http-integration.test.js'
      - 'test/runtime-rejection-boundary.test.js'
      - 'readme.md'
      - '.github/workflows/runtime-lifecycle.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact source head identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked application dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install fixed test-only TypeScript in isolated runner temp prefix
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/domain-haven-tsc" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Typecheck and compile actual runtime source against locked application dependencies
        shell: bash
        run: '"$RUNNER_TEMP/domain-haven-tsc/node_modules/.bin/tsc" --project tsconfig.json'
      - name: Execute HTTP, lifecycle, trace, fatal exception and rejection regressions
        run: node --test test/runtime-lifecycle.test.js test/runtime-trace-policy.test.js test/runtime-fatal-boundary.test.js test/runtime-http-integration.test.js test/runtime-rejection-boundary.test.js
      - name: Prove npm package would contain compiled runtime and type declaration
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/domain-haven-pack.json"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const descriptor = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'domain-haven-pack.json'), 'utf8'))[0];
          const entries = new Set(descriptor.files.map(x => x.path));
          for (const artifact of ['dist/main.js', 'dist/main.d.ts']) {
            assert.ok(entries.has(artifact), 'npm pack would omit required published artifact: ' + artifact);
          }
          NODE
      - name: Preserve committed manifest and lockfile
        if: always()
        run: git diff --exit-code -- package.json package-lock.json
